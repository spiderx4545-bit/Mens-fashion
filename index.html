
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VELVOR - Premium Menswear</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

<header class="navbar">
  <h1>VELVOR</h1>
  <nav>
    <a href="#home">Home</a>
    <a href="#shop">Shop</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<section class="hero" id="home">
  <h2>Elevate Your Style</h2>
  <p>Luxury Men's Fashion</p>
  <button onclick="scrollToSection('shop')">Shop Now</button>
</section>

<section id="shop" class="products">
  <h2>Featured Collection</h2>
  <div class="product-grid">

    <div class="card">
      <img src="https://via.placeholder.com/250">
      <h3>Premium Shirt</h3>
      <p>₹1299</p>
      <button onclick="addToCart('Premium Shirt')">Add to Cart</button>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/250">
      <h3>Luxury Jacket</h3>
      <p>₹2499</p>
      <button onclick="addToCart('Luxury Jacket')">Add to Cart</button>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/250">
      <h3>Casual Tee</h3>
      <p>₹799</p>
      <button onclick="addToCart('Casual Tee')">Add to Cart</button>
    </div>

  </div>
</section>

<section class="cart-section">
  <h2>Your Cart</h2>
  <ul id="cartList"></ul>
  <button onclick="checkout()">Checkout</button>
</section>

<section id="about" class="about">
  <h2>About Us</h2>
  <p>VELVOR creates premium, minimal fashion inspired by global luxury brands.</p>
</section>

<section id="contact" class="contact">
  <h2>Contact Us</h2>
  <form action="https://formspree.io/f/mzdogobk" method="POST">
    <input type="text" name="name" placeholder="Your Name" required>
    <input type="email" name="email" placeholder="Your Email" required>
    <textarea name="message" placeholder="Message" required></textarea>
    <button type="submit">Send Message</button>
  </form>
</section>

<footer>
  <p>© 2026 VELVOR</p>
</footer>

<script src="script.js"></script>
</body>
</html>
